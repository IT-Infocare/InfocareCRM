<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // Dynamically adjust <base href> based on current URL path
    (function() {
      try {
        var base = document.querySelector('base');
        var path = window.location.pathname || '/';
        if (path.toLowerCase().indexOf('/crm') === 0) {
          if (base) base.setAttribute('href', '/CRM/');
        } else if (path === '/' || path === '') {
          if (base) base.setAttribute('href', '/');
        }
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Infocare CRM - Enterprise Lead & Customer Management System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Infocare CRM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Performance Preconnect -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <title>Infocare CRM</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F172A;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(15, 118, 110, 0.25);
      border-left-color: #0f766e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #F8FAFC;
      margin-bottom: 4px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-title">Infocare CRM</div>
    <div class="loading-subtitle">Loading workspace...</div>
  </div>
  <script>
    // Ensure any previously cached service worker or stale assets are evicted
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Asynchronously pre-warm backend REST API on Render to eliminate cold starts
    try {
      fetch('https://infocarecrm.onrender.com/api/health', { mode: 'cors' }).catch(function(){});
    } catch(e) {}
  </script>
  <script>
    function removeLoader() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() {
          if (loading && loading.parentNode) {
            loading.parentNode.removeChild(loading);
          }
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    // Safety fallback: always dismiss loader after 4s so login page is never blocked
    setTimeout(removeLoader, 4000);
  </script>
</body>
</html>
